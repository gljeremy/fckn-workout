server {
  listen 80;
  root /usr/share/nginx/html;

  location = / {
    return 302 /fckn-workout/;
  }

  # For the homelab deployer's health check.
  location = /fckn-workout/health {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Built assets have content hashes in their names.
  location /fckn-workout/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /fckn-workout/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /fckn-workout/index.html;
  }
}
